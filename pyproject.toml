[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lossless-prompt-minifier"
version = "0.1.0"
description = "Semantic whitespace and comment minifier for structured prompts reducing token consumption without parsing degradation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
lossless-prompt-minifier = "lossless_prompt_minifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lossless_prompt_minifier*"]
